groups:
  - name: aioops-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          increase(http_requests_total{status_code=~"5.."}[5m]) / increase(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "More than 5% of requests are failing over the last 5 minutes."

      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High 95th percentile latency"
          description: "Service latency exceeds 1 second for the 95th percentile."

      - alert: LogErrorSpike
        expr: |
          increase(http_requests_total{status="500"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Error rate spike detected"
          description: "High number of server errors detected in the last 5 minutes."
