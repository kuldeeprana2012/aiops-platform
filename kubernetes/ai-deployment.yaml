apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
        - name: ai-engine
          image: yourrepo/aioops-ai-engine:latest
          ports:
            - containerPort: 8080
          env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: aioops-secrets
                  key: slack_webhook_url
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aioops-secrets
                  key: telegram_token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: aioops-secrets
                  key: telegram_chat_id
            - name: OLLAMA_URL
              value: http://ollama:11434
